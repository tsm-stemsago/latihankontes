        // Kunci Jawaban (0 = A, 1 = B, 2 = C, 3 = D, 4 = E)
        const answerKey = [
            0, 2, 1, 3, 2,  1, 1, 1, 1, 1,  // 1-10
            3, 2, 3, 2, 1,  1, 1, 1, 1, 2,  // 11-20
            4, 1, 0, 1, 2,  1, 0, 1, 2, 1,  // 21-30
            1, 3, 0, 2, 2,  2, 1, 1, 1, 0,  // 31-40
            2, 1, 1, 1, 1,  1, 1, 2, 1, 0,  // 41-50
            2, 1, 2, 1, 2,  1, 2, 2, 2, 1,  // 51-60
            1, 1, 1, 2, 1,  2, 1, 3, 2, 2,  // 61-70
            1, 1, 1, 1, 0,  2, 1, 1, 2, 1,  // 71-80
            0, 2, 0, 1, 2,  1, 1, 2, 0, 1,  // 81-90
            1, 1, 0, 1, 2,  2, 0, 1, 1, 2   // 91-100
        ];

        let questions = [];
        let userAnswers = new Array(100).fill(null);
        let currentIndex = 0;

        // Timer settings
        const TOTAL_TIME = 90 * 60; // 90 menit dalam detik
        let timeLeft = TOTAL_TIME;
        let timerInterval = null;

        // Memuat state dari Session Storage
        function loadState() {
            const savedAnswers = sessionStorage.getItem('userAnswers');
            const savedTime = sessionStorage.getItem('timeLeft');
            const savedIndex = sessionStorage.getItem('currentIndex');

            if (savedAnswers) userAnswers = JSON.parse(savedAnswers);
            if (savedTime) timeLeft = parseInt(savedTime);
            if (savedIndex) currentIndex = parseInt(savedIndex);

            if (savedAnswers || savedTime || savedIndex) {
                const btnText = document.getElementById('btn-start-text');
                if(btnText) btnText.innerText = "Lanjutkan Kuis";
            }
        }
        loadState();

        // Parser Soal
        function parseQuestions() {
            const lines = rawData.split('\n');
            let currentQ = null;
            
            lines.forEach(line => {
                const text = line.trim();
                if (!text || text.startsWith('Bagian') || text.startsWith('Kunci')) return;
                
                // Cek jika baris adalah nomor soal (misal: "1. Salah satu...")
                if (/^\d+\./.test(text)) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { text: text, options: [] };
                } else if (/^[A-E]\./.test(text)) {
                    // Cek jika baris adalah opsi jawaban (misal: "A. Plan...")
                    if (currentQ) currentQ.options.push(text);
                }
            });
            if (currentQ) questions.push(currentQ);

            // Masukkan kunci jawaban
            questions.forEach((q, i) => {
                q.correctAnswer = answerKey[i];
            });
        }

        // Initialize
        parseQuestions();

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            initNavigation();
            renderQuestion();
            startTimer();
        }

        function startTimer() {
            updateTimerDisplay();
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    sessionStorage.setItem('timeLeft', timeLeft);
                    updateTimerDisplay();
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Waktu pengerjaan telah habis! Jawaban Anda akan dikumpulkan secara otomatis.");
                    submitQuiz(true); // true = auto submit
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer-display').innerText = 
                `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function initNavigation() {
            const navGrid = document.getElementById('nav-grid');
            navGrid.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${i}`;
                btn.innerText = i + 1;
                btn.onclick = () => jumpToQuestion(i);
                navGrid.appendChild(btn);
            }
        }

        function updateNavigation() {
            for (let i = 0; i < questions.length; i++) {
                const btn = document.getElementById(`nav-btn-${i}`);
                if (!btn) continue;
                
                let classes = 'w-full aspect-square rounded-md font-bold text-sm transition-all focus:outline-none flex items-center justify-center ';
                
                // Status terjawab atau belum
                if (userAnswers[i] !== null) {
                    classes += 'bg-green-500 text-white shadow-sm border border-green-600 ';
                } else {
                    classes += 'bg-gray-100 text-gray-600 hover:bg-gray-200 border border-gray-300 ';
                }

                // Status aktif (sedang dilihat)
                if (i === currentIndex) {
                    classes += 'ring-2 ring-offset-1 ring-red-500 transform scale-110 z-10 ';
                }

                btn.className = classes;
            }
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            document.getElementById('current-question-num').innerText = currentIndex + 1;
            document.getElementById('question-text').innerText = q.text;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((optText, i) => {
                const isSelected = userAnswers[currentIndex] === i;
                const letter = String.fromCharCode(65 + i); // A, B, C, D, E

                const label = document.createElement('label');
                label.className = `option-label flex items-center p-4 border rounded-lg cursor-pointer ${isSelected ? 'selected-option' : 'border-gray-200'}`;
                
                label.innerHTML = `
                    <input type="radio" name="option" value="${i}" class="h-5 w-5 text-red-600 focus:ring-red-500 mr-4" ${isSelected ? 'checked' : ''} onchange="selectOption(${i})">
                    <span class="text-gray-700 font-medium">${optText}</span>
                `;
                optionsContainer.appendChild(label);
            });

            // Button states
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            
            if (currentIndex === questions.length - 1) {
                document.getElementById('btn-next').classList.add('hidden');
                document.getElementById('btn-submit').classList.remove('hidden');
            } else {
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-submit').classList.add('hidden');
            }

            updateNavigation(); // Update navigasi saat ganti soal
        }

        function selectOption(optIndex) {
            userAnswers[currentIndex] = optIndex;
            sessionStorage.setItem('userAnswers', JSON.stringify(userAnswers));
            renderQuestion(); // Re-render to show selected styling
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            sessionStorage.setItem('currentIndex', currentIndex);
            renderQuestion();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                sessionStorage.setItem('currentIndex', currentIndex);
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                sessionStorage.setItem('currentIndex', currentIndex);
                renderQuestion();
            }
        }

        function submitQuiz(autoSubmit = false) {
            // Cek jika ada yang belum dijawab
            if (!autoSubmit) {
                const unanswered = userAnswers.filter(ans => ans === null).length;
                if (unanswered > 0) {
                    const confirmSubmit = confirm(`Anda masih memiliki ${unanswered} soal yang belum dijawab. Yakin ingin mengumpulkan?`);
                    if (!confirmSubmit) return;
                }
            }

            clearInterval(timerInterval); // Hentikan timer

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            calculateScore();
            renderReview();
            window.scrollTo(0, 0);
        }

        function calculateScore() {
            let correctCount = 0;
            userAnswers.forEach((ans, i) => {
                if (ans === questions[i].correctAnswer) correctCount++;
            });
            
            // Skor maksimal 100 karena ada 100 soal
            document.getElementById('final-score').innerText = correctCount;
            
            let message = "";
            if (correctCount >= 85) message = "Luar biasa! Pengetahuan Anda sangat kompeten.";
            else if (correctCount >= 70) message = "Bagus! Terus tingkatkan kemampuan teknis Anda.";
            else message = "Tetap semangat! Anda perlu banyak mempelajari ulang BPR dan teori dasar.";
            
            document.getElementById('score-message').innerText = message;
        }

        function renderReview() {
            const container = document.getElementById('review-container');
            container.innerHTML = '';

            questions.forEach((q, i) => {
                const userAnswerIdx = userAnswers[i];
                const correctIdx = q.correctAnswer;
                const isCorrect = userAnswerIdx === correctIdx;
                const answeredLetter = userAnswerIdx !== null ? String.fromCharCode(65 + userAnswerIdx) : '-';
                const correctLetter = String.fromCharCode(65 + correctIdx);

                const item = document.createElement('div');
                item.className = `p-5 rounded-lg border-l-4 shadow-sm bg-white ${isCorrect ? 'border-green-500' : 'border-red-500'}`;
                
                item.innerHTML = `
                    <div class="font-bold text-gray-800 mb-2">${q.text}</div>
                    <div class="text-sm space-y-1 mt-3">
                        <p class="${isCorrect ? 'text-green-600 font-semibold' : 'text-red-600 font-semibold'}">
                            Jawaban Anda: ${answeredLetter} ${userAnswerIdx !== null ? '(' + q.options[userAnswerIdx] + ')' : '(Tidak dijawab)'}
                        </p>
                        ${!isCorrect ? `<p class="text-green-600 font-semibold">Kunci Jawaban: ${correctLetter} (${q.options[correctIdx]})</p>` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function confirmResetQuiz() {
            const isConfirmed = confirm("Yakin ingin mereset kuis? Seluruh waktu dan jawaban Anda akan terhapus dan kembali ke awal.");
            if (isConfirmed) {
                sessionStorage.clear();
                location.reload();
            }
        }

        function restartQuiz() {
            sessionStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
